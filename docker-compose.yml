version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATASET_PATH=./data/flood_dataset.csv
      - TARGET_COLUMN=flood
      - MODEL_PATH=./models/flood_model.pkl
      - PREPROCESSOR_PATH=./models/preprocessor.pkl
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
