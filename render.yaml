services:
  - type: web
    name: flood-guard
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: CORS_ORIGINS
        value: "*"
      - key: MODEL_PATH
        value: models/flood_model.pkl
      - key: PREPROCESSOR_PATH
        value: models/preprocessor.pkl
      - key: DATASET_PATH
        value: data/flood_dataset.csv
      - key: TARGET_COLUMN
        value: flood